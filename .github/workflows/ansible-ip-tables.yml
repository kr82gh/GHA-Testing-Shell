name: Run Ansible

permissions:
 contents: read

on: 
    workflow_dispatch:
        inputs:
            CM-Check:
                description: "Which CM ?"
                required: true
                type: string

jobs:
  
    Ansible:
        name: Ansible 
        continue-on-error: false
        runs-on: self-hosted
        steps:
            - name: install
              run: |
                python -m pip install --upgrade pip
                pip install ansible jmespath

    