name: Run Ansible

permissions:
 contents: read

on: 
    workflow_dispatch:
        inputs:
            CM-Check:
                description: "Which CM ?"
                required: true
                type: string

jobs:
  
    Ansible:
        name: Ansible 
        continue-on-error: false
        runs-on: self-hosted
        steps:
            - name: checkout-stuff
              uses: actions/checkout@v4 #Must have the "v" for  version  
            - name: run ansible 
              run: |
                ansible-playbook -i yaml/ansible/inventory.yml yaml/ansible/iptables-playbook.yml | tee >> $GITHUB_STEP_SUMMARY

    